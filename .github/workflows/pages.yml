name: Deploy to GitHub Pages

# Publishes two pages, both static:
#
#   index.html     the planner. GitHub Pages runs no server, so the CSED engine is
#                  executed in the visitor's browser under Pyodide — the same engine
#                  source the local server imports, so results are identical.
#   explorer.html  the data explorer, on which the extraction itself can be checked.
#
# The database is rebuilt from the committed sources on every push, so what is published
# is never stale relative to the data in the repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pypdf pytest

      - name: Build the database
        run: python -m aptg_ingest.cli --data data --out out --strict
        env:
          PYTHONPATH: src

      - name: Run the test suite
        run: python -m pytest tests -q
        env:
          PYTHONPATH: src

      - name: Assemble the site
        run: python -m aptg_ingest.webbuild --root . --db out/aptg.sqlite --site site
        env:
          PYTHONPATH: src

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
